version: '3.8'

services:
  subscriptions-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/subscriptions_db
      - APPLE_SHARED_SECRET=${APPLE_SHARED_SECRET:-}
      - APPLE_SANDBOX=${APPLE_SANDBOX:-true}
      - GOOGLE_PACKAGE_NAME=com.bargain.wiz
      - GOOGLE_CREDENTIALS_PATH=/app/credentials/google-credentials.json
      - FIREBASE_CREDENTIALS_PATH=/app/credentials/firebase-credentials.json
      - ENVIRONMENT=development
      - DEBUG=true
      - USE_MOCK_VERIFIERS=${USE_MOCK_VERIFIERS:-false}
    volumes:
      - ./credentials:/app/credentials:ro
      - ./app:/app/app
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=subscriptions_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
